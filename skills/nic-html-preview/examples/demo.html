<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nic-html-preview demo</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf1;
      --accent: #3d9cf0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, #1a2a3a 0%, transparent 55%),
        radial-gradient(900px 500px at 90% 80%, #1e3a2f 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      opacity: 0.75;
    }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
      color: var(--accent);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>nic-html-preview</h1>
    <p>本地 HTML → localhost → Cursor 内置浏览器</p>
    <div class="badge">NicSkills · first skill</div>
  </main>
</body>
</html>
