<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">nic-visual-code promo</title>
  <desc id="desc">Promotional banner for nic-visual-code: Mermaid, SVG, HTML, icons without image API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="55%" stop-color="#152938"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      .t { font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Helvetica, Arial, sans-serif; }
    ]]></style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="220" fill="#1a2a3a" opacity="0.55"/>
  <circle cx="1120" cy="600" r="240" fill="#1e3a2f" opacity="0.35"/>

  <text class="t" x="80" y="140" fill="#5eb1ff" font-size="22" letter-spacing="3">NICSKILLS SKILL</text>
  <text class="t" x="80" y="210" fill="#e7ecf1" font-size="64" font-weight="750">nic-visual-code</text>
  <text class="t" x="80" y="270" fill="#8aa0b5" font-size="26">Mermaid / SVG / HTML / Icons - no image API</text>

  <g>
    <rect x="80" y="340" width="260" height="120" rx="18" fill="#1a2a3a" stroke="#5eb1ff" stroke-width="2"/>
    <text class="t" x="210" y="395" text-anchor="middle" fill="#e7ecf1" font-size="28" font-weight="700">Mermaid</text>
    <text class="t" x="210" y="430" text-anchor="middle" fill="#8aa0b5" font-size="16">flow / architecture</text>

    <rect x="370" y="340" width="260" height="120" rx="18" fill="#1a2a3a" stroke="#5eb1ff" stroke-width="2"/>
    <text class="t" x="500" y="395" text-anchor="middle" fill="#e7ecf1" font-size="28" font-weight="700">SVG</text>
    <text class="t" x="500" y="430" text-anchor="middle" fill="#8aa0b5" font-size="16">icons / illustrations</text>

    <rect x="660" y="340" width="260" height="120" rx="18" fill="#1a2a3a" stroke="#5eb1ff" stroke-width="2"/>
    <text class="t" x="790" y="395" text-anchor="middle" fill="#e7ecf1" font-size="28" font-weight="700">HTML</text>
    <text class="t" x="790" y="430" text-anchor="middle" fill="#8aa0b5" font-size="16">one-page visuals</text>

    <rect x="950" y="340" width="250" height="120" rx="18" fill="#3d9cf0"/>
    <text class="t" x="1075" y="395" text-anchor="middle" fill="#0f1419" font-size="28" font-weight="750">1:1</text>
    <text class="t" x="1075" y="430" text-anchor="middle" fill="#0f1419" font-size="16">icon default</text>
  </g>

  <text class="t" x="80" y="560" fill="#8aa0b5" font-size="20">Themes: dark-dev / light-clean / mono / brand</text>
  <text class="t" x="80" y="600" fill="#8aa0b5" font-size="20">Sizes: 1:1 / 16:9 / 9:16 / og / custom WxH</text>
  <text class="t" x="80" y="660" fill="#6f879c" font-size="16">UTF-8 safe labels - editable - git-friendly</text>
</svg>
